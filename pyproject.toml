[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "protosurv-repro"
version = "0.1.0"
description = "Prior-guided whole-slide survival modelling with soft histopathologic priors"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
runtime = [
  "torch>=2.1",
  "h5py>=3.9",
  "Pillow>=10.0",
  "scikit-learn>=1.3",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
protosurv-make-splits = "scripts.make_splits:main"
protosurv-build-graphs = "scripts.build_graphs:main"
protosurv-extract-priors = "scripts.extract_cached_priors:main"
protosurv-train-cv = "scripts.train_cv:main"
protosurv-evaluate-external = "scripts.evaluate_external:main"
protosurv-export-attention = "scripts.export_attention:main"
protosurv-benchmark = "scripts.benchmark:main"
protosurv-graph-sensitivity = "scripts.run_graph_sensitivity:main"
protosurv-compare-external = "scripts.compare_external_predictions:main"
protosurv-rasterize-annotations = "scripts.rasterize_annotations:main"
protosurv-evaluate-localization = "scripts.evaluate_localization:main"

[tool.setuptools.packages.find]
include = ["protosurv*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py310"
